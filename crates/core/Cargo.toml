[package]
name = "cadence-core"
version = "1.2.0"
edition = "2021"

[features]
default = []
test-support = []

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
tokio = { version = "1", features = ["rt"] }

[[test]]
name = "db_open_tests"
required-features = ["test-support"]
