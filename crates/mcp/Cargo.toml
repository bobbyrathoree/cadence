[package]
name = "cadence-mcp"
version = "1.2.0"
edition = "2021"

[features]
default = []
test-support = ["cadence-core/test-support"]
test-faults = []

[dependencies]
cadence-core = { path = "../core" }
rmcp = { version = "=3.1.0", features = ["server", "macros", "transport-io", "schemars"] }
rusqlite = "0.31"
schemars = "1"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
uuid = "1"

[dev-dependencies]
rmcp = { version = "=3.1.0", features = ["client"] }

[[bin]]
name = "cadence-mcp-smoke"
path = "src/bin/cadence-mcp-smoke.rs"

[[test]]
name = "reference_tool"
required-features = ["test-support"]

[[test]]
name = "wire_tests"
required-features = ["test-support"]

[[test]]
name = "fault_matrix"
required-features = ["test-support", "test-faults"]
