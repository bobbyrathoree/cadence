name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Check baseline
        run: scripts/check-baseline.sh --exact
      - name: Test core support feature
        run: cargo test -p cadence-core --features test-support
      - name: Test app support feature
        run: cargo test -p cadence --features test-support
      - name: Test MCP support feature
        run: cargo test -p cadence-mcp --features test-support
      - name: Test MCP fault matrix
        run: cargo test -p cadence-mcp --features "test-support test-faults" --test fault_matrix
      - name: Check version consistency
        run: scripts/check-versions.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check version consistency
        run: scripts/check-versions.sh
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npx vitest run
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npx playwright test
