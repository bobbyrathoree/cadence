[package]
name = "cadence"
version = "1.2.0"
description = "A local-first macOS prompt library with sequenced workflows"
authors = ["Bobby Rathore"]
edition = "2021"
default-run = "cadence"

[features]
default = []
test-support = ["cadence-core/test-support"]

[lib]
name = "cadence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "api_fatal_harness"
path = "src/testbin/api_fatal_harness.rs"
required-features = ["test-support"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cadence-core = { path = "../crates/core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
subtle = "2"
hex = "0.4"
dirs = "5"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"

[[test]]
name = "lifecycle_matrix"
required-features = ["test-support"]

[[test]]
name = "api_fatal_process"
required-features = ["test-support"]
